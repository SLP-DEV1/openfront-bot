name: Impossible Engine Smoke
on:
  pull_request:
    paths:
      - 'OpenFront_Solo_AggroBot.user.js'
      - 'tools/benchmark/**'
      - 'trainer/**'
      - '.github/workflows/impossible-engine.yml'
  workflow_dispatch:

jobs:
  real-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch exact official Impossible code and maps
        run: |
          git clone --depth 1 https://github.com/openfrontio/OpenFrontIO.git ../OpenFrontIO
          git -C ../OpenFrontIO fetch --depth 1 origin bb8af015b515b3b717bd4d901074c5f4c16641cb
          git -C ../OpenFrontIO checkout --detach bb8af015b515b3b717bd4d901074c5f4c16641cb
          cd ../OpenFrontIO
          npm ci --ignore-scripts
      - name: Run actual official-engine Impossible game (integration smoke)
        run: |
          node -e "require('fs').writeFileSync('zero-policy.json', JSON.stringify(require('./trainer/policy.cjs').zero()))"
          node tools/benchmark/engine-match.mjs \
            --engine ../OpenFrontIO \
            --engineCommit bb8af015b515b3b717bd4d901074c5f4c16641cb \
            --map World --size Compact --difficulty Impossible \
            --bots 0 --nations 1 --seed impossible-ci-001 --ticks 2200 \
            --profile autonomous --policy zero-policy.json --out benchmark-results/impossible-ci
      - name: Exercise one neural evolution generation with real Impossible games
        run: |
          node trainer/train.mjs \
            --engine ../OpenFrontIO \
            --engineCommit bb8af015b515b3b717bd4d901074c5f4c16641cb \
            --generations 1 --population 2 --trainSeeds 1 --evalSeeds 2 \
            --maps World --nations 1 --ticks 4500 --qwen false \
            --out benchmark-results/neural-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impossible-engine-smoke
          path: |
            benchmark-results/impossible-ci
            benchmark-results/neural-ci
          if-no-files-found: ignore
