name: Impossible Engine Smoke
on:
  push:
    branches: [main]
    paths:
      - 'OpenFront_Solo_AggroBot.user.js'
      - 'OpenFront_AggroBot_Impossible_Run3.user.js'
      - 'src/**'
      - 'tools/build-userscript.cjs'
      - 'tools/build-run3-bundle.cjs'
      - 'tools/benchmark/common.cjs'
      - 'tools/benchmark/trajectory.cjs'
      - 'tools/benchmark/holdout-evidence.cjs'
      - 'tools/benchmark/engine-capacity-smoke.mjs'
      - 'tools/benchmark/engine-match.mjs'
      - 'trainer/*.js'
      - 'trainer/*.cjs'
      - 'trainer/*.mjs'
      - 'trainer/*.json'
      - 'docs/training-analysis-20260921/schema4-impossible-world-europe-20260920-run3/champion.json'
      - '.github/workflows/impossible-engine.yml'
  pull_request:
    paths:
      - 'OpenFront_Solo_AggroBot.user.js'
      - 'OpenFront_AggroBot_Impossible_Run3.user.js'
      - 'src/**'
      - 'tools/build-userscript.cjs'
      - 'tools/build-run3-bundle.cjs'
      - 'tools/benchmark/common.cjs'
      - 'tools/benchmark/trajectory.cjs'
      - 'tools/benchmark/holdout-evidence.cjs'
      - 'tools/benchmark/engine-capacity-smoke.mjs'
      - 'tools/benchmark/engine-match.mjs'
      - 'trainer/*.js'
      - 'trainer/*.cjs'
      - 'trainer/*.mjs'
      - 'trainer/*.json'
      - 'docs/training-analysis-20260921/schema4-impossible-world-europe-20260920-run3/champion.json'
      - '.github/workflows/impossible-engine.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch exact official Impossible code and maps
        run: |
          git clone --depth 1 https://github.com/openfrontio/OpenFrontIO.git ../OpenFrontIO
          git -C ../OpenFrontIO fetch --depth 1 origin bb8af015b515b3b717bd4d901074c5f4c16641cb
          git -C ../OpenFrontIO checkout --detach bb8af015b515b3b717bd4d901074c5f4c16641cb
          cd ../OpenFrontIO
          npm ci --ignore-scripts
      - name: Verify official City/Factory troop capacity on pinned engine
        run: |
          node tools/benchmark/engine-capacity-smoke.mjs \
            --engine ../OpenFrontIO \
            --engineCommit bb8af015b515b3b717bd4d901074c5f4c16641cb
      - name: Run actual official-engine Impossible game (integration smoke)
        run: |
          node -e "require('fs').writeFileSync('zero-policy.json', JSON.stringify(require('./trainer/action-policy.cjs').zero()))"
          node tools/benchmark/engine-match.mjs \
            --engine ../OpenFrontIO \
            --engineCommit bb8af015b515b3b717bd4d901074c5f4c16641cb \
            --map World --size Compact --difficulty Impossible \
            --bots 0 --nations 1 --seed impossible-ci-001 --ticks 2200 \
            --profile autonomous --policy zero-policy.json --out benchmark-results/impossible-ci
          node -e "const m=require('./benchmark-results/impossible-ci/match.json'); const p=require('./trainer/action-policy.cjs');if(m.benchmarkMeta.policySHA256!==require('crypto').createHash('sha256').update(JSON.stringify(p.zero())).digest('hex')||!m.trajectory?.samples?.length||!m.trajectory.summary)process.exit(1)"
      - name: Run delivered Run3 bundle on pinned engine
        run: |
          node tools/benchmark/engine-match.mjs \
            --engine ../OpenFrontIO \
            --engineCommit bb8af015b515b3b717bd4d901074c5f4c16641cb \
            --bot OpenFront_AggroBot_Impossible_Run3.user.js \
            --map World --size Compact --difficulty Impossible \
            --bots 0 --nations 1 --seed run3-ci-001 --ticks 2200 \
            --profile autonomous --out benchmark-results/run3-ci
          node -e "const fs=require('fs'),crypto=require('crypto'),m=require('./benchmark-results/run3-ci/match.json'),expected=crypto.createHash('sha256').update(fs.readFileSync('OpenFront_AggroBot_Impossible_Run3.user.js')).digest('hex');if(m.benchmarkMeta.botSHA256!==expected||!m.trajectory?.samples?.length||!m.trajectory.summary)process.exit(1)"
      - name: Reproducibility - identical Run3 policy, same seed twice, must match (box 238)
        run: |
          node tools/benchmark/engine-match.mjs \
            --engine ../OpenFrontIO \
            --engineCommit bb8af015b515b3b717bd4d901074c5f4c16641cb \
            --bot OpenFront_AggroBot_Impossible_Run3.user.js \
            --map World --size Compact --difficulty Impossible \
            --bots 0 --nations 1 --seed run3-repro --ticks 1000 \
            --profile autonomous --out benchmark-results/run3-repro-a
          node tools/benchmark/engine-match.mjs \
            --engine ../OpenFrontIO \
            --engineCommit bb8af015b515b3b717bd4d901074c5f4c16641cb \
            --bot OpenFront_AggroBot_Impossible_Run3.user.js \
            --map World --size Compact --difficulty Impossible \
            --bots 0 --nations 1 --seed run3-repro --ticks 1000 \
            --profile autonomous --out benchmark-results/run3-repro-b
          node -e "const a=require('./benchmark-results/run3-repro-a/match.json'),b=require('./benchmark-results/run3-repro-b/match.json');const c=m=>JSON.stringify({s:m.trajectory?.samples,sum:m.trajectory?.summary,b:m.benchmarkMeta?.botSHA256});if(!a.trajectory?.samples?.length||!b.trajectory?.samples?.length)process.exit(1);if(c(a)!==c(b)){console.error('Run3 policy NOT reproducible: two same-seed trajectories differ');process.exit(1)}console.log('Run3 policy reproducible: two same-seed runs produced identical trajectories');"
      - name: Run scripted-human Public FFA smoke
        run: |
          node tools/benchmark/engine-match.mjs \
            --engine ../OpenFrontIO \
            --engineCommit bb8af015b515b3b717bd4d901074c5f4c16641cb \
            --map World --size Compact --difficulty Medium \
            --bots 0 --nations 0 --seed multiplayer-ci-001 --ticks 2600 \
            --gameType Public --gameMode FFA --scriptedHumans 2 --opponentProfile mixed \
            --profile autonomous --out benchmark-results/multiplayer-ci
          node -e "const m=require('./benchmark-results/multiplayer-ci/match.json'); if(m.benchmarkMeta.gameConfig.gameType!=='Public'||m.benchmarkMeta.scriptedHumans!==2||!m.run.scriptedStats||m.run.scriptedStats.intents<1) process.exit(1)"
      - name: Exercise one neural evolution generation with real Impossible games
        run: |
          node trainer/train.mjs --schema 4 \
            --engine ../OpenFrontIO \
            --engineCommit bb8af015b515b3b717bd4d901074c5f4c16641cb \
            --generations 1 --population 2 --parallel 2 --trainSeeds 1 --evalSeeds 2 \
            --maps World --nations 1 --ticks 4500 \
            --out benchmark-results/neural-ci
          node -e "const fs=require('fs'),path=require('path'),root='benchmark-results/neural-ci',plan=require('./'+root+'/plan.json'),report=require('./'+root+'/generation-1.json'),rows=[...report.evaluation.incumbent.rows,...report.evaluation.candidate.rows];if(!rows.length||!rows.some(r=>r.validSample)||rows.some(r=>r.botSHA256!==plan.botSHA256||require('./'+path.join(root,r.dir,'match.json')).benchmarkMeta.botSHA256!==plan.botSHA256))process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impossible-engine-smoke
          path: |
            benchmark-results/impossible-ci
            benchmark-results/run3-ci
            benchmark-results/run3-repro-a
            benchmark-results/run3-repro-b
            benchmark-results/multiplayer-ci
            benchmark-results/neural-ci
          if-no-files-found: ignore
