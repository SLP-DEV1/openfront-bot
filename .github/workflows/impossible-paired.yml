name: Impossible Paired Evaluation
on:
  pull_request:
    paths:
      - '.github/workflows/impossible-paired.yml'
      - 'tools/benchmark/**'
      - 'OpenFront_Solo_AggroBot.user.js'
  workflow_dispatch:

jobs:
  paired-impossible:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch PR base bot and exact Impossible engine
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || '101be8d4b9e4e2ace855d67d5c159f8a69b0e71a' }}
        run: |
          git fetch --depth 1 origin "$BASELINE_SHA"
          git show "$BASELINE_SHA:OpenFront_Solo_AggroBot.user.js" > baseline.user.js
          echo "Comparing bot baseline $BASELINE_SHA against candidate $GITHUB_SHA"
          git clone --depth 1 https://github.com/openfrontio/OpenFrontIO.git ../OpenFrontIO
          git -C ../OpenFrontIO fetch --depth 1 origin bb8af015b515b3b717bd4d901074c5f4c16641cb
          git -C ../OpenFrontIO checkout --detach bb8af015b515b3b717bd4d901074c5f4c16641cb
          cd ../OpenFrontIO
          npm ci --ignore-scripts
      - name: Compare PR base against candidate on matching Impossible seeds
        run: |
          node tools/benchmark/impossible-matrix.mjs \
            --engine ../OpenFrontIO --engineCommit bb8af015b515b3b717bd4d901074c5f4c16641cb \
            --baseline baseline.user.js --candidate OpenFront_Solo_AggroBot.user.js \
            --maps World,Europe --size Compact --nations 4 --bots 0 \
            --seeds impossible-101,impossible-102 --ticks 18000 \
            --out benchmark-results/impossible-paired-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impossible-paired-results
          path: benchmark-results/impossible-paired-ci
          if-no-files-found: ignore
