name: Issue 94 patch
on:
  push:
    branches: [fix/issue-94-team-enemy-metrics]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[issue94-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-94-team-enemy-metrics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire hostile classification into multibot metrics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/benchmark/engine-multibot.mjs')
          s=p.read_text()
          old="const {aggregateRecordings}=localRequire('./multibot-recording.cjs');"
          new=old+"\nconst {hostilePlayers}=localRequire('./enemy-metrics.cjs');"
          assert old in s and "localRequire('./enemy-metrics.cjs')" not in s
          s=s.replace(old,new,1)
          old2="const enemies=(view.playerViews?.()||[]).filter(p=>p?.clientID?.()!==me?.clientID?.()&&p?.isAlive?.());"
          assert old2 in s
          s=s.replace(old2,"const enemies=hostilePlayers(view.playerViews?.()||[],me);",1)
          p.write_text(s)
          PY
          node tests/enemy-metrics-regression.cjs
          node --check tools/benchmark/engine-multibot.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/benchmark/engine-multibot.mjs
          git commit -m 'fix(benchmark): exclude allies from enemy trajectory metrics [issue94-applied]'
          git push
