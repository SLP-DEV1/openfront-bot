name: Publish First Public Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-first-preview.yml'
      - 'release-notes/v1.21.5.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-openfront-v1-21-5
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
      - name: Validate release assets
        run: |
          set -euo pipefail
          test -s OpenFront_Solo_AggroBot.user.js
          test -s OpenFront_AggroBot_Impossible_Run3.user.js
          test -s release-notes/v1.21.5.md
          grep -qE '^// @version[[:space:]]+1\.21\.5$' OpenFront_Solo_AggroBot.user.js
          grep -qE '^// @version[[:space:]]+1\.21\.5$' OpenFront_AggroBot_Impossible_Run3.user.js
          node --check OpenFront_Solo_AggroBot.user.js
          node --check OpenFront_AggroBot_Impossible_Run3.user.js
      - name: Publish v1.21.5 as an experimental pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.21.5 >/dev/null 2>&1; then
            echo 'v1.21.5 already exists; not creating a duplicate.'
            exit 0
          fi
          gh release create v1.21.5 \
            OpenFront_Solo_AggroBot.user.js \
            OpenFront_AggroBot_Impossible_Run3.user.js \
            --title 'OpenFront AggroBot v1.21.5 — First Public Preview' \
            --notes-file release-notes/v1.21.5.md \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --latest=false
