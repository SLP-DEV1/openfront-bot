name: Publish AggroBot v1.21.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.21.6.yml'
      - 'release-notes/v1.21.6.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-openfront-v1-21-6
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version and JavaScript syntax
        run: |
          set -euo pipefail
          test -s release-notes/v1.21.6.md
          grep -qE '^// @version[[:space:]]+1\.21\.6$' OpenFront_Solo_AggroBot.user.js
          grep -qE '^// @version[[:space:]]+1\.21\.6$' OpenFront_AggroBot_Impossible_Run3.user.js
          node --check OpenFront_Solo_AggroBot.user.js
          node --check OpenFront_AggroBot_Impossible_Run3.user.js
          node tools/build-userscript.cjs --check
          node tools/build-run3-bundle.cjs --check
      - name: Publish updated English pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.21.6 >/dev/null 2>&1; then
            echo 'Release already exists, skipping duplicate.'
            exit 0
          fi
          gh release create v1.21.6 \
            OpenFront_Solo_AggroBot.user.js \
            OpenFront_AggroBot_Impossible_Run3.user.js \
            --title 'OpenFront AggroBot v1.21.6 — English UI & Compatibility Preview' \
            --notes-file release-notes/v1.21.6.md \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --latest=false
