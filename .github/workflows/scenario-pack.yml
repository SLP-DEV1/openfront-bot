name: Deterministic Scenario Pack
on:
  pull_request:
    paths:
      - 'OpenFront_Solo_AggroBot.user.js'
      - 'OpenFront_AggroBot_Impossible_Run3.user.js'
      - 'tools/benchmark/**'
      - 'tests/scenario-pack-regression.cjs'
      - 'tests/evidence-panel-regression.cjs'
      - '.github/workflows/scenario-pack.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run all ten scenarios rather than the three-case CI smoke'
        type: boolean
        default: false
      run3:
        description: 'Test the delivered Impossible Run3 bundle instead of Solo'
        type: boolean
        default: false

jobs:
  scenario-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official pinned engine
        run: |
          git clone --depth 1 https://github.com/openfrontio/OpenFrontIO.git ../OpenFrontIO
          git -C ../OpenFrontIO fetch --depth 1 origin bb8af015b515b3b717bd4d901074c5f4c16641cb
          git -C ../OpenFrontIO checkout --detach bb8af015b515b3b717bd4d901074c5f4c16641cb
          cd ../OpenFrontIO
          npm ci --ignore-scripts
      - name: Check reproducible scenario runner and bundles
        run: |
          node tests/scenario-pack-regression.cjs > /dev/null
          node tools/build-run3-bundle.cjs --check
      - name: Execute actual-engine scenarios
        shell: bash
        run: |
          BOT=OpenFront_Solo_AggroBot.user.js
          if [[ "${{ inputs.run3 }}" == "true" ]]; then
            BOT=OpenFront_AggroBot_Impossible_Run3.user.js
          fi
          EXTRA=(--smoke)
          if [[ "${{ inputs.full }}" == "true" ]]; then
            EXTRA=()
          fi
          node tools/benchmark/scenario-pack.cjs --execute "${EXTRA[@]}" \
            --engine ../OpenFrontIO \
            --engineCommit bb8af015b515b3b717bd4d901074c5f4c16641cb \
            --bot "$BOT" --ticks 700 \
            --out benchmark-results/scenario-pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-pack-results
          path: benchmark-results/scenario-pack
          if-no-files-found: ignore
