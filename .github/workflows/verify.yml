name: Verify AggroBot
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check userscript syntax
        run: node --check OpenFront_Solo_AggroBot.user.js
      - name: Check regression test syntax
        run: node --check tests/strategy-regression.cjs
      - name: Check match report syntax
        run: node --check tools/match-report.cjs
      - name: Test bot strategy
        run: node tests/strategy-regression.cjs

      - name: Test hybrid learning
        run: node tests/learning-regression.cjs

      - name: Check benchmark tools
        run: |
          node --check tools/benchmark/engine-match.mjs
          node --check tools/benchmark/serve-browser.mjs
          node --check tools/benchmark/suite.mjs
          node tests/benchmark-regression.cjs
