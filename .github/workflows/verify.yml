name: Verify AggroBot
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check userscript syntax
        run: node --check OpenFront_Solo_AggroBot.user.js
      - name: Verify deterministic Run3 bundle and model/source fingerprints
        run: |
          node --check tools/build-run3-bundle.cjs
          node tools/build-run3-bundle.cjs --check
          node --check tests/bundled-run3-regression.cjs
          node tests/bundled-run3-regression.cjs
      - name: Check actual-engine capacity probe syntax
        run: node --check tools/benchmark/engine-capacity-smoke.mjs
      - name: Verify pinned capacity formula (not integrated engine)
        run: node tests/capacity-reference-regression.cjs
      - name: Check regression test syntax
        run: node --check tests/strategy-regression.cjs
      - name: Check match report syntax
        run: node --check tools/match-report.cjs
      - name: Verify two-browser localhost Duo Relay
        run: |
          node --check tools/duo-relay.cjs
          node tests/duo-relay-regression.cjs
          node tests/duo-relay-oversize-regression.cjs
      - name: Verify experiment manifest provenance
        run: |
          node --check tools/benchmark/experiment-manifest.cjs
          node --check tests/experiment-manifest-regression.cjs
          node tests/experiment-manifest-regression.cjs
      - name: Check signed income and observed-trade regressions
        run: |
          node --check OpenFront_Solo_AggroBot.user.js
          node --check OpenFront_AggroBot_Impossible_Run3.user.js
          node --check tests/strategy-regression.cjs
      - name: Test live monitor and browser persistence
        run: |
          node --check OpenFront_AggroBot_Monitor.user.js
          node --check tools/live-monitor.cjs
          node tests/live-monitor-regression.cjs
          node tests/browser-finish-regression.cjs
      - name: Test diagnostic v2 journal and Duo event capture
        run: |
          node --check tests/diagnostic-v2-regression.cjs
          node tests/diagnostic-v2-regression.cjs
          node --check tests/diagnostic-zip-regression.cjs
          node tests/diagnostic-zip-regression.cjs
          node --check tests/diagnostic-evidence-regression.cjs
          node tests/diagnostic-evidence-regression.cjs
      - name: Test bot strategy
        run: node tests/strategy-regression.cjs
      - name: Test P0 decision frame linkage
        run: |
          node --check tests/decision-frame-regression.cjs
          node tests/decision-frame-regression.cjs
      - name: Test P1 versioned opponent archetypes
        run: |
          node --check tests/archetype-regression.cjs
          node tests/archetype-regression.cjs
      - name: Test match auto-start and panel
        run: |
          node --check tests/autostart-regression.cjs
          node tests/autostart-regression.cjs
      - name: Test hybrid learning
        run: node tests/learning-regression.cjs
      - name: Verify canonical source build and directly importable runtime modules
        run: |
          node --check tools/build-userscript.cjs
          node tools/build-userscript.cjs --check
          node tests/modular-build-regression.cjs
          node tests/duo-status-regression.cjs
          node tests/shadow-v5-regression.cjs
          node tests/replay-cli-regression.cjs
          node --check trainer/shadow-deploy.mjs
          node --check tools/benchmark/replay-cli.cjs
      - name: Test P2 replay curriculum (event tags, per-match split, provenance)
        run: |
          node --check tools/benchmark/replay-events.cjs
          node tests/replay-events-regression.cjs
          node --check tools/benchmark/replay-split.cjs
          node tests/replay-split-regression.cjs
          node tests/replay-curriculum-regression.cjs
          node --check tools/benchmark/replay-raw-preflight.cjs
          node tests/replay-raw-preflight-regression.cjs
          node --check tools/benchmark/replay-engine-extract.mjs
          node tests/replay-engine-extract-regression.cjs
          node --check tools/benchmark/schema4-ablation.cjs
          node tests/issue121-133-acceptance-regression.cjs
          node --check tools/benchmark/replay-reconstruct.mjs
          node tests/replay-reconstruct-regression.mjs
      - name: Test P3 schema-5 offline training (features, labels, deterministic train, shadow)
        run: |
          node --check trainer/v5-features.cjs
          node tests/v5-features-regression.cjs
          node --check trainer/v5-labels.cjs
          node tests/v5-labels-regression.cjs
          node --check trainer/train-v5.cjs
          node tests/train-v5-regression.cjs
          node --check tests/v5-runtime-parity-regression.cjs
          node tests/v5-runtime-parity-regression.cjs
          node tests/v5-shadow-regression.cjs
          node --check trainer/v5-control-evidence.cjs
          node tests/v5-control-departure-regression.cjs
      - name: Test P4 curriculum league and collapse watcher
        run: |
          node --check trainer/collapse-watch.cjs
          node tests/collapse-watch-regression.cjs
          node --check tools/benchmark/curriculum.cjs
          node tests/curriculum-regression.cjs
      - name: Test P5 paired shadow/holdout promotion runner (dry run)
        run: |
          node --check tools/benchmark/paired-holdout.cjs
          node tests/paired-holdout-regression.cjs
          node tools/benchmark/paired-holdout.cjs --bot OpenFront_AggroBot_Impossible_Run3.user.js --run3Policy docs/training-analysis-20260921/schema4-impossible-world-europe-20260920-run3/champion.json --candidateModel trainer/candidate-v5-holdout.json --engineCommit 13b403387af01d388f8c8ed8c953b6d3a11d1457 --out .ci/p5-holdout --mode 1v1 --maps World,Europe --opponents balanced,rush --runs 2
      - name: Test P5 new-holdout seed freeze (disjoint from training + prior holdouts)
        run: |
          node --check tools/benchmark/freeze-holdout-seeds.cjs
          node tests/holdout-freeze-regression.cjs
      - name: Check Scenario Pack and read-only Evidence Mode
        run: |
          node --check tools/benchmark/scenario-pack.cjs
          node tests/scenario-pack-regression.cjs > /dev/null
          node tests/evidence-panel-regression.cjs
      - name: Check benchmark tools
        run: |
          node --check tools/benchmark/engine-match.mjs
          node --check tools/benchmark/engine-multibot.mjs
          node tests/enemy-metrics-regression.cjs
          node tests/winner-outcome-regression.cjs
          node --check tools/benchmark/league.cjs
          node --check tools/benchmark/serve-browser.mjs
          node --check tools/benchmark/suite.mjs
          node tests/benchmark-regression.cjs
          node --check tools/benchmark/impossible-matrix.mjs
          node tools/benchmark/impossible-matrix.mjs --dryRun true > /dev/null
      - name: Test decision-impact and champion provenance
        run: |
          node --check tools/benchmark/v5-decision-impact.cjs
          node tests/v5-decision-impact-failclosed-regression.cjs
          node tests/v5-decision-impact-provenance-regression.cjs
          node tests/overnight-champion-provenance-regression.cjs
      - name: Test league plan provenance identities
        run: |
          node --check tools/benchmark/league-plan.mjs
          node tests/league-plan-regression.cjs
      - name: Test P1 league completion (protocols, rotation, snapshot, smoke, alliance)
        run: |
          node --check tools/benchmark/scenario-pack.cjs
          node tests/league-protocol-rotation-regression.cjs
          node tests/league-snapshot-regression.cjs
          node tests/league-smoke-separation-regression.cjs
          node tests/alliance-semantics-regression.cjs
      - name: Test visible browser backend
        run: |
          node --check tools/benchmark/serve-browser.mjs
          node --check tools/benchmark/openfront-backend.mjs
          node --check tests/openfront-backend-regression.cjs
          node tests/openfront-backend-regression.cjs
      - name: Check neural holdout proof
        run: |
          node --check tools/benchmark/holdout-evidence.cjs
          node --check tools/benchmark/holdout-eval.mjs
          node tests/holdout-regression.cjs
      - name: Check V3 map breakdown export
        run: |
          node --check tools/benchmark/v3-map-breakdown.mjs
          node tests/v3-map-breakdown-regression.cjs
      - name: Test P6 paired model-promotion evidence gate
        run: |
          node tests/workflow-trigger-regression.cjs
          node --check trainer/promotion-gate-v5.cjs
          node tests/promotion-gate-v5-regression.cjs
          node --check trainer/candidate-policy-v5.cjs
          node tests/candidate-policy-v5-regression.cjs
          node --check tools/benchmark/replay-visible-state.cjs
          node tests/replay-visible-state-regression.cjs
      - name: Test neural trainer and deployer
        run: |
          node --check trainer/train.mjs
          node --check trainer/deploy.mjs
          node --check trainer/policy.cjs
          node tests/neural-regression.cjs
          node --check trainer/reward.cjs
          node --check trainer/evaluation-v2.cjs
          node --check tests/neural-v2-regression.cjs
          node tests/neural-v2-regression.cjs
      - name: Test §7 Gesamtabnahme (reproducible baseline, visible data, schema-5, shadow non-causal)
        run: |
          node --check trainer/train-schema5.cjs
          node tests/schema5-training-regression.cjs
          node tests/visible-training-data-regression.cjs
          node tests/reproducible-baseline-regression.cjs
          node tests/shadow-v5-noncausal-regression.cjs
